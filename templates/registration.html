<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>students details</title>
<link rel="stylesheet" href="{{ url_for('static' , filename='registration.css')}}">

</head>

<body>
   <header class="header">
   
  <div class="logo">Student Registration</div>
  <nav>
    <a href="index.html">Personal Details</a>
    <a href="prenatal.html">Pre-natal</a>
    <a href="natal.html">Natal</a>
    <a href="postnatal.html">Post-natal</a>
  </nav>
</header>  
<main class="container"> 
 
<div class="form-box">
        <h2>Student Informations</h2>
        <form id="studentform" onsubmit="return(validate);">
           <div class="top-grid">
            <div class="name-field">
           <label>  First Name: </label>
           <input type="text"  required><br> 
           <label>  Last Name: </label>
           <input type="text"  required><br> 
            </div>  
            <div class="bod-field">
            
            <label>Birth Date:</label>
            <input type="date" id ="birthdate"required>
            <span class="error" id ="birtherror"></span><br>
            
            <label>Age:</label> 
            <input type="number"  id="age" readonly>
            <span class="error" id="ageerror"></span>
            <br> 
           
            </div></div>
            <label>Gender  </label>
            <div class="gender-ratio">
            <label><input type="radio"  name="gender" value="male">Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
            </div>
            <div class="gurdian-info">
              <div class="info">
            <label>Guardian Name:</label>
            <input type="text"required> <br>
            </div>
            <div class="info">
              <label>Contact Number:</label>
            <input type="tel" id="contact"size="10" required>
            <span class="error" id="contacterror"></span>
            </div>
          </div>
           <label>School going</label>
    <div class="checkbox-group">
      <label><input type="checkbox"  name="school">  Yes</label>
      <label><input type="checkbox" name="school"> No</label>
    </div>
    <br>
           <div class="address-field">
            <div class="address-grid">
              <div class="left-address">
                <label>Address Line 1:</label><br>
                <input type="text" ><br>
                <label>Address Line 2:</label><br>
                <input type="text"><br>
                <label>City </label><br>
                <input type="text" id="city"><br>
                </div>
                <div class="right-address"><br>
                <label>State </label><br>
                <input type ="text" id="state"><br>
                <label>Country </label><br>
                <input type="text" id="country"><br>
                <label>Pincode</label><br>
                <input type="tel" size="6" id ="pincode">
                <span class="error" id pinerror></span><br><br>
              </div>
            </div>
         </div>
         <br>   
         <div class="btn-grid">
         <button type="reset" onclick="clr()">Reset</button>
          <button type="submit">Next</button>
        </div>
        </form>
</div>
</main> 
<footer>
  <p>© 2026 MySite</p>
</footer>

<script src="index.js"></script>
</body>

</html>
